name: TPG Substation Temporary Export

on:
  push:
    branches:
      - temp-substation-export-20260903
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - intact
          - destroyed
          - lod1
          - lod2
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://download.blender.org/release/Blender4.1/blender-4.1.1-windows-x64.zip -OutFile "$env:RUNNER_TEMP\blender.zip"
          Expand-Archive "$env:RUNNER_TEMP\blender.zip" "$env:RUNNER_TEMP\blender" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\blender" -Filter blender.exe -Recurse | Select-Object -First 1
          "BLENDER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install EDM exporter
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/EagleDynamics/Blender-EDM-Exporter.git "$env:RUNNER_TEMP\edm"
          git -C "$env:RUNNER_TEMP\edm" checkout 5f03ba70ec96ca6ce68028eabc786ecd97f9cf93
          New-Item -ItemType Directory -Force -Path ".edm-blender-scripts\addons" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\edm\io_scene_edm" ".edm-blender-scripts\addons\io_scene_edm"
          Rename-Item ".edm-blender-scripts\addons\io_scene_edm\Materials" "__materials_casefix"
          Rename-Item ".edm-blender-scripts\addons\io_scene_edm\__materials_casefix" "materials"
          "BLENDER_USER_SCRIPTS=$env:GITHUB_WORKSPACE\.edm-blender-scripts" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path edm-artifacts | Out-Null
          & $env:BLENDER_EXE --background --python tools/tpg_substation_public_export.py -- --variant ${{ matrix.variant }} --artifact-dir edm-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: substation-${{ matrix.variant }}
          path: edm-artifacts/**
          retention-days: 7

  package:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: substation-*
          path: merged
          merge-multiple: true
      - name: Package
        shell: pwsh
        run: python tools/package_tpg_substation_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: TPG-Electrical-Substation-V1.0-FINAL
          path: TPG_Electrical_Substation_V1.0_DCS_DropIn.zip
          retention-days: 7
